<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Completo</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card-tela">

        <h3>Degrau 7: O Sistema Completo (Com I/O e Reset)</h3>

        <div class="linha-inputs">

            <input id="nome" type="text" placeholder="Nome">

            <input id="email" type="email" placeholder="E-mail">

            <button
                class="btn-acao btn-azul"
                id="btnSalvar"
                onclick="salvar()">
                Salvar
            </button>

        </div>


        <div class="linha-inputs barra-ferramentas">

            <button
                class="btn-acao btn-verde"
                onclick="exportar()">
                💾 Exportar
            </button>


            <label class="btn-acao btn-roxo">

                📂 Importar JSON

                <input
                    type="file"
                    accept=".json"
                    onchange="importar(event)"
                    style="display: none;"
                >

            </label>


            <button
                class="btn-acao btn-vermelho"
                onclick="resetar()">
                🔄 Resetar Tudo
            </button>

        </div>


        <table class="tabela-dados">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody id="lista">
            </tbody>

        </table>

    </div>


    <script src="script.js"></script>

</body>
</html>
